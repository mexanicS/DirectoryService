name: Publish Shared Kernel

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'DirectoryService/src/Shared.Kernel/**'
      - '.github/workflows/publish-shared-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DirectoryService
    env:
      NuGetPackageSourceCredentials_github: Username=mexanicS;Password=${{ secrets.GH_PACKAGES_PAT }};ValidAuthenticationTypes=Basic
      NUGET_API_KEY: ${{ secrets.GH_PACKAGES_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Require package token
        shell: bash
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "Set the repository Actions secret GH_PACKAGES_PAT before publishing" >&2
            exit 1
          fi
      - name: Choose package version
        id: version
        shell: bash
        run: |
          base_version="$(dotnet msbuild src/Shared.Kernel/Shared.Kernel.csproj -getProperty:Version)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable release tags must have the form vX.Y.Z" >&2
              exit 1
            fi
            if [[ "$version" != "$base_version" ]]; then
              echo "Release tag and Shared.Kernel.csproj Version must match" >&2
              exit 1
            fi
          else
            version="${base_version}-preview.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Restore Shared Kernel
        run: dotnet restore src/Shared.Kernel/Shared.Kernel.csproj --configfile nuget.config
      - name: Pack Shared Kernel
        run: dotnet pack src/Shared.Kernel/Shared.Kernel.csproj --configuration Release --no-restore --output artifacts -p:PackageVersion=${{ steps.version.outputs.value }}
      - name: Check private package before publishing
        shell: bash
        run: |
          status="$(curl -sS -o "$RUNNER_TEMP/package.json" -w '%{http_code}' \
            -H "Authorization: Bearer $NUGET_API_KEY" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/mexanicS/packages/nuget/MexanicS.SharedKernel)"
          case "$status" in
            200)
              visibility="$(jq -r '.visibility' "$RUNNER_TEMP/package.json")"
              if [[ "$visibility" != "private" ]]; then
                echo "The existing package is not private" >&2
                exit 1
              fi
              ;;
            404) echo "Package not found; first private publication will create it" ;;
            *)
              echo "Could not check package visibility (HTTP $status)" >&2
              exit 1
              ;;
          esac
      - name: Publish to GitHub Packages
        run: dotnet nuget push "artifacts/MexanicS.SharedKernel.${{ steps.version.outputs.value }}.nupkg" --source github --api-key "$NUGET_API_KEY" --configfile nuget.config --skip-duplicate
      - name: Verify private visibility
        shell: bash
        run: |
          package_json="$(curl -fsS \
            -H "Authorization: Bearer $NUGET_API_KEY" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/mexanicS/packages/nuget/MexanicS.SharedKernel)"
          visibility="$(printf '%s' "$package_json" | jq -r '.visibility')"
          test "$visibility" = "private"
