name: Verify shared package restore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DirectoryService
    env:
      NuGetPackageSourceCredentials_github: Username=mexanicS;Password=${{ secrets.GH_PACKAGES_PAT }};ValidAuthenticationTypes=Basic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Require package token
        env:
          PACKAGE_TOKEN: ${{ secrets.GH_PACKAGES_PAT }}
        run: |
          if [[ -z "$PACKAGE_TOKEN" ]]; then
            echo "Set GH_PACKAGES_PAT to restore private shared packages" >&2
            exit 1
          fi
      - name: Restore solution from GitHub Packages
        run: dotnet restore DirectoryService.sln --configfile nuget.config
      - name: Build solution
        run: dotnet build DirectoryService.sln --configuration Release --no-restore
